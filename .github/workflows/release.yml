name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write   # create the release and upload bundles
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple silicon)
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - os: macos-latest
            label: macOS (Intel)
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            label: Linux (x86_64)
            args: ''
            target: ''
          - os: windows-latest
            label: Windows (x86_64)
            args: ''
            target: ''
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Bundles the app and attaches it to a draft release for the tag.
      # Builds are unsigned: macOS will need a right-click > Open on first run,
      # and Windows will show a SmartScreen warning. Signing needs paid
      # certificates, which this project doesn't have.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: instagrab ${{ github.ref_name }}
          releaseBody: |
            Unsigned builds. On macOS, right-click the app and choose Open the
            first time; on Windows, choose "More info" then "Run anyway".
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
